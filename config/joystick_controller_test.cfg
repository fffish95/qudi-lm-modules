global:
    # list of modules to load when starting
    startup: []

    # Module server configuration for accessing qudi GUI/logic/hardware modules from remote clients
    remote_modules_server:
        address: 'localhost'
        port: 12345

    # Server port for serving the active qudi module namespace locally (localhost).
    # Used by e.g. the Qudi jupyter kernel.
    namespace_server_port: 18861

    # If this flag is set (True), all arguments passed to qudi module APIs from remote
    # (jupyter notebook, qudi console, remote modules) will be wrapped and passed "per value"
    # (serialized and de-serialized). This is avoiding a lot of inconveniences with using numpy in
    # remote clients.
    # If you do not want to use this workaround and know what you are doing, you can disable this
    # feature by setting this flag to False.
    force_remote_calls_by_value: True

    # Qss stylesheet for controlling the appearance of the GUIs.
    # Absolute path or relative to qudi.artwork.styles
    stylesheet: 'qdark.qss'

    # Default root directory for measurement data storage. All eventual data sub-directories should
    # be contained within this directory. This is not enforced, just convention.
    default_data_dir: 'Data/'

    # Save data to daily data sub-directories by default
    daily_data_dirs: True

hardware:

    # Attocube-style nanopositioner, talked to over a raw TCP socket (an
    # ASCII console on a password-protected port). CHANGE "ip" to your
    # device's real IP address.
    nanopositioner:
        module.Class: 'local.nanopositioner_controller.NanopositionerController'
        options:
            ip: '10.140.0.212'          # CHANGE ME
            port: 7231
            password: '123456'
            timeout: 1.0
            x_axis: 5
            y_axis: 6
            z_axis: 4

    # Newport picomotor controller, talked to over a raw TCP socket.
    # CHANGE "ip" to your device's real IP address.
    picomotor:
        module.Class: 'local.picomotor_controller.PicomotorController'
        options:
            ip: '10.140.0.213'          # CHANGE ME
            port: 23
            timeout: 1.0
            x1_axis: 1
            y1_axis: 2
            x2_axis: 3
            y2_axis: 4

    # NewFocus 8752 picomotor driver (axes x1, y1, z, x2, y2), talked to over TCP.
    # CHANGE "ip" to your device's real IP address.
    newfocus_8752_tcp_client:
        module.Class: 'local.tcpclient.TCP_client.TCPClient'
        options:
            ip: '10.140.1.232'          # CHANGE ME
            port: 23
            timeout: 0.1
            buffer: 1024

logic:

    nf8752:
        module.Class: 'local.newfocus8752_logic.NF8752Logic'
        connect:
            tcpclient: 'newfocus_8752_tcp_client'

    joystickcontrollerlogic:
        module.Class: 'local.joystick_controller_logic.JoystickControllerLogic'
        # All connectors are optional: to leave a device out, comment out its
        # module above AND its line here (same as for sps_customscanlogic).
        # If you comment out all three lines, comment out "connect:" too.
        connect:
            nanopositioner: 'nanopositioner'
            #picomotor: 'picomotor'
            nf8752: 'nf8752'
        options:
            step_sizes: [1, 10, 40, 200]
            poll_interval: 0.15               # seconds between controller polls
            nf8752_velocity: 100              # NF8752 steps/s (1..2000)
            nf8752_acceleration: 500          # NF8752 steps/s^2 (1..32000)
            trigger_blind: 20                 # ignore L2/R2 analog readings below this magnitude (0-255 scale)
            emergency_max_delay: 1.0          # seconds allowed between two "PS" button taps to trigger emergency stop
            # Only used if your controller/driver reports the D-pad as a "hat"
            # (SDL2 reports the PS5 D-pad as buttons 11-14, see button_map).
            dpad_hat_index: 0
            dpad_invert_x: False              # flip D-pad left/right if your directions are mirrored
            dpad_invert_y: False              # flip D-pad up/down
            # Button/axis indices can depend on controller/driver/OS. Defaults
            # are SDL2's PS5 (DualSense) layout. If a button does nothing, turn
            # on "Diagnostic mode" in the GUI (Tools menu), press the button and
            # copy the printed index here.
            button_map:
                cross: 0
                circle: 1
                square: 2
                triangle: 3
                share: 4                      # "Create" button, cycles step size
                playstation: 5                # double-tap = emergency stop
                l1: 9
                r1: 10
                dpad_up: 11
                dpad_down: 12
                dpad_left: 13
                dpad_right: 14
            trigger_axes:
                l2: 4
                r2: 5

gui:

    joystickcontrollergui:
        module.Class: 'local.joystick_controller.joystickcontrollergui.JoystickControllerGui'
        connect:
            joystickcontrollerlogic1: 'joystickcontrollerlogic'
